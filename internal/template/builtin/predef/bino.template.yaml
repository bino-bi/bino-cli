apiVersion: bino.bi/v1alpha1
kind: ProjectTemplate
metadata:
  name: predef
spec:
  # The [package] fields the wizard asks for; --set accepts the same names.
  fields:
    - { name: Scope, prompt: "Registry scope (without @)", default: acme }
    - { name: Description, prompt: "Description", default: "A reusable kit: an IBCS table, the style it wears and a logo asset." }
    - { name: Visibility, prompt: "Visibility (public/private)", default: private }
    - { name: Tags, prompt: "Tags (comma-separated)", default: "starter, ibcs" }
    - { name: Category, prompt: "Category", default: components }
  verbatim:
    - .bnignore
    - .gitignore
  # Never read as text: the logo shipped with the package.
  binary:
    - "*.png"
