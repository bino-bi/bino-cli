# Bino project configuration
# This file marks the root of a bino reporting project.
# Generated by 'bino init predef' on {{ .Date }}

report-id = "{{ .ReportID }}"
{{- if .EngineVersion }}
engine-version = {{ .EngineVersion | yaml }}
{{- end }}

# The [package] table marks this project as a predef project: an ordinary bino
# project that also authors a reusable registry package. Every document the
# package publishes carries the package name in its metadata.name.
[package]
name = {{ .PackageName | yaml }}
{{- if .PackageDescription }}
description = {{ .PackageDescription | yaml }}
{{- end }}
{{- if .PackageTags }}
tags = [{{ range $i, $t := .PackageTags }}{{ if $i }}, {{ end }}{{ $t | yaml }}{{ end }}]
{{- end }}
{{- if .PackageCategory }}
category = {{ .PackageCategory | yaml }}
{{- end }}
visibility = {{ .PackageVisibility | yaml }}
compat-engine = ">=1.0.0-alpha.1"

# Without an explicit list every canonical manifest folder is published.
# mocks/, reports/ and .bino/ are never part of a package, and a package file
# may sit at most one directory deep.
# include = ["components", "styles", "resources"]

preview = "components/revenue_table.yaml#{{ .PackageName }}/revenue_table"
