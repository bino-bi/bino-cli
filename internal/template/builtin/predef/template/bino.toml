# Bino project configuration
# This file marks the root of a bino reporting project.
# Generated by 'bino init predef' on {{ .Date }}

report-id = "{{ .ReportID }}"
{{- if .EngineVersion }}
engine-version = {{ .EngineVersion | yaml }}
{{- end }}

# The [package] table marks this project as a predef project: an ordinary bino
# project that also authors a reusable registry package. Replace '@acme' with
# your own registry scope, here and in every metadata.name below.
[package]
name = "@acme/{{ .ReportName }}"
description = "A reusable kit: an IBCS table, the style it wears and a logo asset."
tags = ["starter", "ibcs"]
category = "components"
visibility = "private"
compat-engine = ">=1.0.0-alpha.1"

# Without an explicit list every canonical manifest folder is published.
# mocks/, reports/ and .bino/ are never part of a package, and a package file
# may sit at most one directory deep.
# include = ["components", "styles", "resources"]

preview = "components/revenue_table.yaml#@acme/{{ .ReportName }}/revenue_table"
