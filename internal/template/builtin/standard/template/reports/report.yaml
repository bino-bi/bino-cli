apiVersion: bino.bi/v1alpha1
kind: ReportArtefact
metadata:
  name: {{ .ReportName }}
spec:
  format: xga
  orientation: landscape
  language: {{ .Language }}
  filename: {{ .Filename }}
  title: {{ .ReportTitle | yaml }}
  description: {{ printf "Starter report bundle generated by 'bino init' on %s." .Date | yaml }}
  author: {{ "Rainbow Reporting Team" | yaml }}
  keywords:
    - sample
    - bino
    - report
  layoutPages:
    - page: {{ .LayoutName }}
