<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bino preview · starting…</title>
  <link rel="icon" type="image/png" href="/__bino/assets/favicon.png">
  <link rel="stylesheet" href="/__bino/shared/fonts.css">
  <style>
    /* BinoBI DS literals — this page must stay standalone (no tokens.css) */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --bg-wash: radial-gradient(80rem 40rem at 50% -10%, #ecfcfd, #ffffff);
      --fg: #11161a;
      --fg-dim: #6b777d;
      --accent: #5cdae5;
      --error-bg: #f6ddda;
      --error-fg: #c0392b;
      --bar-bg: rgba(17, 22, 26, 0.08);
      --bar-fill: #5cdae5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161a;
        --bg-wash: #11161a;
        --fg: #eef2f3;
        --fg-dim: #9aa7ad;
        --accent: #66dde8;
        --error-bg: rgba(192, 57, 43, 0.2);
        --error-fg: #f6ddda;
        --bar-bg: rgba(154, 167, 173, 0.25);
        --bar-fill: #66dde8;
      }
    }
    html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif; }
    body { background: var(--bg-wash); }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; box-sizing: border-box; }
    .card { width: 100%; max-width: 520px; text-align: center; }
    .logo { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    .logo img { width: 56px; height: 56px; }
    .logo span { font-size: 0.875rem; font-weight: 600; color: var(--fg-dim); }
    .spinner { width: 56px; height: 56px; margin: 0 auto 1.5rem; border-radius: 50%; border: 4px solid var(--bar-bg); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: var(--bar-bg); }
    }
    .phase { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    .detail { font-size: 0.95rem; color: var(--fg-dim); margin: 0 0 1.5rem; min-height: 1.4em; }
    .progress { width: 100%; height: 6px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; margin-bottom: 1rem; opacity: 0; transition: opacity 0.2s ease; }
    .progress.visible { opacity: 1; }
    .progress > span { display: block; height: 100%; width: 0%; background: var(--bar-fill); border-radius: 999px; transition: width 0.25s ease; }
    .hint { font-size: 0.85rem; color: var(--fg-dim); }
    .error { display: none; margin-top: 1.5rem; padding: 1rem 1.25rem; background: var(--error-bg); color: var(--error-fg); border-radius: 16px; text-align: left; }
    .error.visible { display: block; }
    .error h2 { margin: 0 0 0.5rem; font-size: 1rem; }
    .error pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="logo">
        <img src="/__bino/assets/bino-mark.png" alt="" width="56" height="56">
        <span>bino preview</span>
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <p class="phase" id="bn-boot-phase">Starting preview…</p>
      <p class="detail" id="bn-boot-detail"></p>
      <div class="progress" id="bn-boot-progress" aria-hidden="true"><span></span></div>
      <p class="hint">The page reloads automatically when content is ready.</p>
      <div class="error" id="bn-boot-error" role="alert">
        <h2>Boot failed</h2>
        <pre id="bn-boot-error-message"></pre>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var phaseEl = document.getElementById('bn-boot-phase');
      var detailEl = document.getElementById('bn-boot-detail');
      var progressEl = document.getElementById('bn-boot-progress');
      var progressBar = progressEl.querySelector('span');
      var errorEl = document.getElementById('bn-boot-error');
      var errorMsgEl = document.getElementById('bn-boot-error-message');
      var reloadScheduled = false;

      var labels = {
        starting: 'Starting preview…',
        duckdb: 'Loading DuckDB engine',
        explorer: 'Initializing data explorer',
        manifests: 'Loading manifests',
        graph: 'Building dependency graph',
        rendering: 'Rendering report',
        ready: 'Ready',
        error: 'Boot failed'
      };

      function applyStatus(status) {
        if (!status || typeof status !== 'object') return;
        var phase = status.phase || 'starting';
        phaseEl.textContent = labels[phase] || phase;

        if (phase === 'error') {
          errorMsgEl.textContent = status.error || status.message || 'unknown error';
          errorEl.classList.add('visible');
          progressEl.classList.remove('visible');
          detailEl.textContent = '';
          return;
        }
        errorEl.classList.remove('visible');

        var detail = '';
        if (status.item) detail = status.item;
        else if (status.message && phase !== 'starting') detail = status.message;
        detailEl.textContent = detail;

        if (status.total > 0) {
          var pct = Math.max(0, Math.min(100, (status.done / status.total) * 100));
          progressBar.style.width = pct + '%';
          progressEl.classList.add('visible');
        } else {
          progressEl.classList.remove('visible');
        }

        if (phase === 'ready' && !reloadScheduled) {
          reloadScheduled = true;
          // Brief pause so the user perceives the "Ready" state.
          setTimeout(function () { window.location.reload(); }, 250);
        }
      }

      // Pull the latest snapshot once in case boot finished before this tab
      // connected to the SSE stream.
      fetch('/__preview/boot-status', { cache: 'no-store' })
        .then(function (r) {
          if (r.status === 204) return null;
          if (!r.ok) return null;
          return r.json();
        })
        .then(function (status) { if (status) applyStatus(status); })
        .catch(function () { /* ignore */ });

      if (!window.EventSource) return;
      var source = new EventSource('/__preview/events');
      source.addEventListener('boot-status', function (event) {
        try {
          applyStatus(JSON.parse(event.data || '{}'));
        } catch (err) { /* ignore malformed */ }
      });
      window.addEventListener('beforeunload', function () { source.close(); });
    }());
  </script>
</body>
</html>
