# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pin duckdb-go to v2.5.5 — later versions require matching DuckDB
      # native libraries and extension compatibility (see release.yml).
      - dependency-name: "github.com/duckdb/duckdb-go/v2"
      - dependency-name: "github.com/duckdb/duckdb-go-bindings"
      - dependency-name: "github.com/duckdb/duckdb-go-bindings/*"

  - package-ecosystem: npm
    directory: /vscode-bino
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/vscode must track engines.vscode (^1.85.0). Bumping it above the
      # engines floor makes `vsce package` fail at release time. Pin until we
      # intentionally raise the minimum supported VS Code version.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
