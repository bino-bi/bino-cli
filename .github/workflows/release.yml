# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

# DuckDB version MUST match the duckdb-go driver version in go.mod.
# duckdb-go v2.5.5 → duckdb-go-bindings v0.3.3 → DuckDB v1.4.4
#
# ENGINE_VERSION is the bn-template-engine baked into the container image. It MUST
# satisfy engine.SupportedEngineRanges (internal/engine/compat.go) and MUST match
# the ENGINE_VERSION default in the Dockerfile. It cannot be resolved dynamically:
# the engine's GitHub "latest" release skips pre-releases and still points at 0.x.
# TestDockerEngineVersionPin (internal/engine/pin_test.go) enforces both rules —
# it drifted below the supported floor for four releases before that test existed.
env:
  DUCKDB_VERSION: "v1.4.4"
  ENGINE_VERSION: "v1.0.0-next.24"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Resolve tag for both push and workflow_dispatch triggers
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Resolve tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Resolved tag: ${TAG}, version: ${TAG#v}"

  test:
    name: Test
    needs: [ resolve-tag ]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build-vscode-extension:
    name: Build VS Code Extension
    needs: [ resolve-tag, test ]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vscode-bino/package-lock.json

      - name: Install dependencies
        working-directory: vscode-bino
        run: npm ci

      - name: Compile extension
        working-directory: vscode-bino
        run: npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        working-directory: vscode-bino
        run: vsce package --out vscode-bino.vsix

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: vscode-bino/vscode-bino.vsix
          retention-days: 30
      - name: Publish to VS Code Marketplace
        working-directory: vscode-bino
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish -p "$VSCE_PAT" ${{ needs.resolve-tag.outputs.version }}

  # Build binaries for each platform (CGO required for duckdb-go).
  # macOS and Linux use the default duckdb-go-bindings (extensions installed at runtime).
  # Windows links the pre-built DuckDB DLL from GitHub releases.
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [ test, resolve-tag ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          # chrome-headless-shell has no official linux/arm64 build, so this binary
          # needs a system chromium plus --chrome-path (or CHROME_PATH) to render
          # PDFs. The container image ships one; see the build-image job.
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download pre-built DuckDB library (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          curl -sL -o libduckdb.zip "https://github.com/duckdb/duckdb/releases/download/${{ env.DUCKDB_VERSION }}/libduckdb-windows-amd64.zip"
          mkdir -p duckdb-lib
          unzip libduckdb.zip -d duckdb-lib
          ls -la duckdb-lib/

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          COMMIT=${GITHUB_SHA::8}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-s -w"
          LDFLAGS="${LDFLAGS} -X 'bino.bi/bino/internal/version.Version=${VERSION}'"
          LDFLAGS="${LDFLAGS} -X 'bino.bi/bino/internal/version.Commit=${COMMIT}'"
          LDFLAGS="${LDFLAGS} -X 'bino.bi/bino/internal/version.Date=${DATE}'"

          BUILD_TAGS=""

          # Windows: link pre-built DuckDB DLL
          if [ "${{ matrix.goos }}" = "windows" ]; then
            DUCKDB_LIB_DIR="${{ github.workspace }}/duckdb-lib"
            BUILD_TAGS="-tags duckdb_use_lib"
            export CGO_LDFLAGS="-L${DUCKDB_LIB_DIR} -lduckdb"
            export CGO_CFLAGS="-I${DUCKDB_LIB_DIR}"
          fi

          mkdir -p dist

          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build ${BUILD_TAGS} -ldflags "${LDFLAGS}" -o dist/bino.exe ./cmd/bino
          else
            go build -ldflags "${LDFLAGS}" -o dist/bino ./cmd/bino
          fi

      - name: Create archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          ARCH=${{ matrix.goarch }}
          if [ "$ARCH" = "amd64" ]; then
            ARCH="x86_64"
          fi
          OS=$(echo "${{ matrix.goos }}" | sed 's/darwin/Darwin/;s/linux/Linux/')
          tar -czvf bino-cli_${OS}_${ARCH}.tar.gz bino
          rm bino

      - name: Copy DuckDB DLL to dist (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Copy-Item "${{ github.workspace }}\duckdb-lib\duckdb.dll" dist\

      - name: Install Inno Setup (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.resolve-tag.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$VERSION installer\bino-setup.iss

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path bino.exe, duckdb.dll -DestinationPath bino-cli_Windows_x86_64.zip
          Remove-Item bino.exe, duckdb.dll

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  # Container images, built natively on amd64 and arm64 runners (no QEMU) and
  # pushed by digest. publish-image merges each variant's two digests into one
  # manifest list. The image builds from source and shares nothing with the
  # tarballs above, so it runs in parallel with `build` and `release`.
  build-image:
    name: Build Image (${{ matrix.variant }}, ${{ matrix.platform }})
    needs: [ test, resolve-tag ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Combinations are enumerated rather than expressed as variant × platform:
      # two `include` entries both carrying `platform` would overwrite each other
      # instead of producing a cross product.
      matrix:
        include:
          - variant: slim
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: slim
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: full
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: full
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Prepare build metadata
        id: prep
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve-tag.outputs.version }}
            COMMIT=${{ steps.prep.outputs.commit }}
            DATE=${{ steps.prep.outputs.date }}
            ENGINE_VERSION=${{ env.ENGINE_VERSION }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.variant }}-${{ matrix.arch }}
          # Provenance is attested once over the merged index by publish-image,
          # consistent with the `release` job. Buildx's own inline attestation
          # manifests would only clutter the index.
          provenance: false
          sbom: false

      # Renders a real report with the baked engine, so an image whose
      # ENGINE_VERSION does not satisfy SupportedEngineRanges cannot reach the
      # registry — the failure mode that shipped in every v0.91.x image. The
      # sample uses only inline DataSources and carries an i18n.yaml, so
      # --network none also asserts the "offline after docker pull" claim and
      # the sample exercises the engine floor that i18n requires. The runner
      # architecture matches matrix.platform, so the digest pulls natively.
      # Scoped to the ReportArtefact: the sample's ScreenshotArtefact captures
      # a dozen components and dominates the runtime without testing anything
      # this step is here to test.
      - name: Smoke-test the built image
        if: matrix.variant == 'full'
        run: |
          docker run --rm --network none \
            -v "$PWD/docs/samples/sales-dashboard:/work" \
            -u "$(id -u):0" \
            "${IMAGE_NAME}@${DIGEST}" \
            build --out-dir dist/ --artefact sales-dashboard
          test -s docs/samples/sales-dashboard/dist/sales-dashboard.pdf
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish Image (${{ matrix.variant }})
    needs: [ build-image, resolve-tag ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: slim
            suffix: "-slim"
          - variant: full
            suffix: ""
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.resolve-tag.outputs.tag, '-') }}

      # Tags and annotations are read from the DOCKER_METADATA_OUTPUT_* env vars
      # rather than interpolated into the script, to keep untrusted-looking values
      # out of the shell.
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done <<< "$DOCKER_METADATA_OUTPUT_ANNOTATIONS"
          for digest in *; do
            args+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Resolve index digest
        id: index
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${DOCKER_METADATA_OUTPUT_VERSION}"
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${DOCKER_METADATA_OUTPUT_VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  release:
    name: Release
    needs: [ build, build-vscode-extension, resolve-tag ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist/
          merge-multiple: true

      - name: Download VS Code extension
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: dist/

      - name: Add installer scripts to dist
        run: |
          mkdir -p dist
          cp install.sh dist/
          cp install.ps1 dist/

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/bino-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip *_setup.exe *.vsix install.sh install.ps1 bino-sbom.spdx.json > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_setup.exe
            dist/*.vsix
            dist/install.sh
            dist/install.ps1
            dist/bino-sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: bino-bi/bino-cli-releases
          token: ${{ secrets.BINO_CLI_RELEASES_TOKEN }}
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          body: |
            ## Bino CLI ${{ needs.resolve-tag.outputs.tag }}

            **Commit:** `${{ github.sha }}`

            Artifacts carry a SLSA v1.0 build-provenance attestation. Verify with:
            ```
            gh attestation verify <file> --repo bino-bi/bino-cli
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_setup.exe
            dist/*.vsix
            dist/install.sh
            dist/install.ps1
            dist/bino-sbom.spdx.json
            dist/checksums.txt
          fail_on_unmatched_files: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [ release, resolve-tag ]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist/

      - name: Extract checksums and update formula
        id: formula
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          CHECKSUMS_FILE="dist/checksums.txt"

          # Extract SHA256 sums from checksums.txt
          SHA256_DARWIN_ARM64=$(grep "bino-cli_Darwin_arm64.tar.gz" "$CHECKSUMS_FILE" | awk '{print $1}')
          SHA256_DARWIN_X86_64=$(grep "bino-cli_Darwin_x86_64.tar.gz" "$CHECKSUMS_FILE" | awk '{print $1}')
          SHA256_LINUX_X86_64=$(grep "bino-cli_Linux_x86_64.tar.gz" "$CHECKSUMS_FILE" | awk '{print $1}')

          echo "Version: $VERSION"
          echo "Darwin ARM64: $SHA256_DARWIN_ARM64"
          echo "Darwin x86_64: $SHA256_DARWIN_X86_64"
          echo "Linux x86_64: $SHA256_LINUX_X86_64"

          # Update formula with actual values
          cp homebrew/bino-cli.rb homebrew/bino-cli-updated.rb
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" homebrew/bino-cli-updated.rb
          sed -i "s/SHA256_DARWIN_ARM64_PLACEHOLDER/$SHA256_DARWIN_ARM64/g" homebrew/bino-cli-updated.rb
          sed -i "s/SHA256_DARWIN_X86_64_PLACEHOLDER/$SHA256_DARWIN_X86_64/g" homebrew/bino-cli-updated.rb
          sed -i "s/SHA256_LINUX_X86_64_PLACEHOLDER/$SHA256_LINUX_X86_64/g" homebrew/bino-cli-updated.rb

          echo "=== Updated formula ==="
          cat homebrew/bino-cli-updated.rb

      - name: Push to Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.BINO_CLI_RELEASES_TOKEN }}
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"

          # Clone the tap repository
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bino-bi/homebrew-tap.git" tap-repo

          # Create Formula directory if it doesn't exist
          mkdir -p tap-repo/Formula

          # Copy the updated formula
          cp homebrew/bino-cli-updated.rb tap-repo/Formula/bino-cli.rb

          # Commit and push
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bino-cli.rb
          git commit -m "Update bino-cli to v${VERSION}" || echo "No changes to commit"
          git push origin main

  build-docs:
    name: Build and Push Docs
    needs: [ release, resolve-tag ]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push docs image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docs
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/bino/cli-docs:${{ needs.resolve-tag.outputs.version }}
            ${{ secrets.DOCKER_REGISTRY }}/bino/cli-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update stack
        uses: fjogeleit/http-request-action@f98bb26551cd1af7d3eb2674578a80754ece88db # v2.0.1
        with:
          url: ${{ secrets.DEPLOY_URL }}
