# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # govulncheck-action performs its own checkout; persisted credentials
          # from this step would duplicate the Authorization header (HTTP 400)
          persist-credentials: false

      - name: Run govulncheck
        # Non-blocking: govulncheck currently panics during its SSA reachability
        # analysis ("ForEachElement called on type containing *types.TypeParam",
        # golang.org/x/tools/go/ssa) on the generics-heavy
        # github.com/modelcontextprotocol/go-sdk dependency. This is an upstream
        # x/tools bug, not a vulnerability. Remove continue-on-error once the
        # upstream fix is released.
        continue-on-error: true
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-file: go.mod
          go-package: ./...
