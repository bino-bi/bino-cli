# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-licenses: BlueOak-1.0.0, MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, Unlicense, CC0-1.0, 0BSD
          # golang.org/x/* carry a Google PATENTS grant next to their
          # BSD-3-Clause license, which the scanner reports as a LicenseRef and
          # then rejects. modelcontextprotocol/go-sdk has a single LICENSE file
          # covering Apache-2.0 code, MIT legacy code and CC-BY-4.0 docs; we
          # only link the code. sharp's prebuilt libvips binaries (@img/*) are
          # LGPL-3.0; they are only used to build the docs site and are not part
          # of the CLI or the published docs image.
          allow-dependencies-licenses: >-
            pkg:golang/github.com/modelcontextprotocol/go-sdk,
            pkg:golang/golang.org/x/crypto,
            pkg:golang/golang.org/x/image,
            pkg:golang/golang.org/x/mod,
            pkg:golang/golang.org/x/net,
            pkg:golang/golang.org/x/sync,
            pkg:golang/golang.org/x/sys,
            pkg:golang/golang.org/x/telemetry,
            pkg:golang/golang.org/x/term,
            pkg:golang/golang.org/x/text,
            pkg:golang/golang.org/x/time,
            pkg:golang/golang.org/x/tools,
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-wasm32,
            pkg:npm/@img/sharp-win32-arm64,
            pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-x64
          comment-summary-in-pr: on-failure
