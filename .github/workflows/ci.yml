# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned for reproducible CI: 'latest' (v2.12.2) regressed staticcheck
          # SA5011, emitting nil-deref false positives on `if x==nil {t.Fatal}; x.Y`
          # across existing test files. Bump deliberately after verifying locally.
          version: v2.12.1

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15 ]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration (PDF pipeline)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # chrome-headless-shell has no pin in the repo: `bino setup` installs the
      # latest stable from Chrome for Testing, so the cache key is derived from
      # what setup would install today. The engine pin is the Dockerfile ARG —
      # TestDockerEngineVersionPin keeps it in step with release.yml and with
      # engine.SupportedEngineRanges.
      - name: Resolve dependency versions
        id: deps
        run: |
          chrome=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er '.channels.Stable.version')
          engine=$(sed -n 's/^ARG ENGINE_VERSION=//p' Dockerfile)
          test -n "$engine"
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

      - name: Cache chrome-headless-shell and template engine
        id: bino-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bino/chrome-headless-shell
            ~/.bino/cdn/bn-template-engine
          key: bino-integration-${{ runner.os }}-chrome-${{ steps.deps.outputs.chrome }}-engine-${{ steps.deps.outputs.engine }}

      # Install through the product's own path so CI exercises the same
      # download/extract code users run. Both sources are public — Chrome for
      # Testing and the bn-template-engine-releases GitHub releases — so no
      # credentials are needed. GitHub Actions sets CI=true, which already
      # disables the update check.
      - name: Install chrome-headless-shell and template engine (bino setup)
        if: steps.bino-cache.outputs.cache-hit != 'true'
        env:
          CGO_ENABLED: "1"
        run: |
          go run ./cmd/bino setup --quiet
          go run ./cmd/bino setup --template-engine --quiet --engine-version "${{ steps.deps.outputs.engine }}"

      - name: Run integration tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags=integration ./internal/report/pipeline/ ./internal/cli/

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-bino/package-lock.json

      - name: Install dependencies
        working-directory: vscode-bino
        run: npm ci

      - name: Compile extension
        working-directory: vscode-bino
        run: npm run compile

  plugin-version:
    name: Plugin Version Sync
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: plugin.json and marketplace.json versions must agree
        run: |
          plugin=$(jq -r '.version' claude-plugin/.claude-plugin/plugin.json)
          market=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          echo "plugin.json:      $plugin"
          echo "marketplace.json: $market"
          if [ "$plugin" != "$market" ]; then
            echo "::error::plugin version drift: plugin.json ($plugin) != marketplace.json ($market). Both are bumped together by .github/workflows/prepare-release.yml."
            exit 1
          fi

  bundle-web:
    name: Web Bundles
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/web/package-lock.json

      - name: Install JS dependencies
        working-directory: internal/web
        run: npm ci

      - name: Regenerate bundles
        run: go generate ./internal/web/...

      - name: Verify bundles are up to date
        run: git diff --exit-code -- internal/web/static/
