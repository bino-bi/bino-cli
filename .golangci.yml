version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  disable:
    - lll
    - nlreturn
    - wrapcheck
    - wsl
  settings:
    # Complexity linters act as a backstop against pathological growth, not a
    # style gate: thresholds are deliberately loose, and pre-existing offenders
    # carry //nolint:gocognit markers. Don't add new ones — refactor instead.
    funlen:
      lines: 250
      statements: -1
    gocognit:
      min-complexity: 60
    gocyclo:
      min-complexity: 60
    errcheck:
      check-type-assertions: true
      check-blank: true
      # The former std-error-handling preset (EXC0001) suppressed errcheck on
      # every .*Close/.*Flush/os.Remove*/print* call, which hid dropped Close
      # errors on writable files. These entries add back only the provably
      # non-lossy pieces; everything else needs a check or a per-line nolint.
      exclude-functions:
        # Terminal/log output: write errors carry no recoverable signal.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - (*github.com/fatih/color.Color).Fprint
        - (*github.com/fatih/color.Color).Fprintf
        - (*github.com/fatih/color.Color).Fprintln
        # Only used for tables on stdout/stderr; Flush surfaces the writer's error.
        - (*text/tabwriter.Writer).Flush
        # Read-only cursor: iteration errors surface via rows.Err instead.
        - (*database/sql.Rows).Close
        # Closing a pure reader (http response bodies, zip entries) cannot
        # lose buffered writes. Writable handles are never these types.
        - (io.ReadCloser).Close
        - (*archive/zip.ReadCloser).Close
        - (*compress/gzip.Reader).Close
        # Writes to an HTTP response go to a client that may already be gone;
        # there is no recovery path inside a handler.
        - (net/http.ResponseWriter).Write
        # goldmark render funcs write into goldmark's buffered writer; write
        # errors surface once at the renderer's flush, not per call.
        - (github.com/yuin/goldmark/util.BufWriter).WriteString
        - (github.com/yuin/goldmark/util.BufWriter).WriteRune
        # Static flag wiring at command construction; fails only on a
        # missing or duplicate flag name, which the cobra tests would catch.
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        # Uniformly best-effort cleanup of process-created temp state in this
        # repo; a load-bearing removal fails loudly at the following step.
        - os.Remove
        - os.RemoveAll
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - paramTypeCombine
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
        - G304
    misspell:
      locale: US
      extra-words:
        - typo: "artefact"
          correction: "artefact"
        - typo: "artefacts"
          correction: "artefacts"
        - typo: "cancelled"
          correction: "cancelled"
        - typo: "recognised"
          correction: "recognised"
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      - linters:
          - gocritic
          - gosec
        path: _test\.go
      - linters:
          - funlen
          - gocognit
          - gocyclo
        path: _test\.go
      - linters:
          - errcheck
        path: _test\.go
        text: Error return value( of .*)? is not checked
      # "x, _ := v.(T)" is the intended zero-value-on-type-miss idiom of the
      # schema/YAML map-walking code; with check-blank errcheck would flag
      # every comma-ok assertion with a blanked ok. Blank-discarded CALLS stay
      # flagged: the pattern requires a type assertion (".(") after the "=".
      - linters:
          - errcheck
        source: ',\s*_\s*:?=\s*[^(]*\.\('
      # Wizard prompts: cancel falls back to the prompt default and every
      # write is still gated by the preview + confirm tail. The per-prompt
      # error checks arrive with the finishWizard consolidation (#187); a
      # scoped rule avoids annotating 60+ lines that refactor replaces.
      - linters:
          - errcheck
        path: internal/cli/add_.*\.go
        source: '(addPrompt(String|Confirm|ConstraintBuilder)|execCmd\.Run)\('
      - linters:
          - revive
        path: _test\.go
        text: should not use underscores in Go names
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - revive
        text: should have a package comment
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(bino.bi/bino)
    goimports:
      local-prefixes:
        - bino.bi/bino
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
