apiVersion: bino.bi/v1alpha1
kind: DataSet
metadata:
  name: revenue_by_region
spec:
  query: SELECT * FROM revenue_data ORDER BY categoryIndex
  dependencies:
    - revenue_data
---
apiVersion: bino.bi/v1alpha1
kind: DataSet
metadata:
  name: revenue_trend
spec:
  query: SELECT * FROM monthly_revenue ORDER BY date
  dependencies:
    - monthly_revenue
---
apiVersion: bino.bi/v1alpha1
kind: DataSet
metadata:
  name: financial_summary
spec:
  query: SELECT * FROM kpi_table_data ORDER BY rowGroupIndex, categoryIndex
  dependencies:
    - kpi_table_data
---
apiVersion: bino.bi/v1alpha1
kind: DataSet
metadata:
  name: product_portfolio
spec:
  query: SELECT * FROM portfolio_data ORDER BY categoryIndex
  dependencies:
    - portfolio_data
